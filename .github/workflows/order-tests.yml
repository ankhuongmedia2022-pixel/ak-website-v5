name: Checkout regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check order.js
      - run: node --test tests/order.test.cjs
